<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redslate Films</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }

        .btn { padding: 15px 40px; background: #c41e3a; color: white; text-decoration: none; font-size: 1rem; border: none; cursor: pointer; }
        .btn:hover { background: #a01729; }
    </style>
</head>
<body>
    <div class="hero">
        <div>
            <h1>TEST</h1>
            <p>Coming Soon</p>
            <button class="btn">Enter</button>

</html>
