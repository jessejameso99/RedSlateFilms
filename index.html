<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redslate Films</title>
    <style>
.hero::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
.hero > div { position: relative; z-index: 2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; background-size: cover; background-position: center; }
        h1 { font-size: 5rem; margin-bottom: 1rem; }
        p { font-size: 1.5rem; color: #aaa; margin-bottom: 2rem; }
        .btn { padding: 15px 40px; background: #c41e3a; color: white; text-decoration: none; font-size: 1rem; border: none; cursor: pointer; }
        .btn:hover { background: #a01729; }
    </style>
</head>
<body>
    <div class="hero" style="background-image: url('images/REDSLATE FILMS LOGO.jpg'); background-size: cover; background-position: center;">
        <div><img src="images/REDSLATE%20FILMS%20LOGO.jpg" alt="Redslate Films Logo" style="width: 300px; margin-bottom: 2rem;">
            <h1>REDSLATE FILMS</h1>
            <p>Coming Soon</p>
            <button class="btn">Enter</button>
        </div>
    </div>
</body>
</html>
